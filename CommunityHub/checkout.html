<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Received | VenueDesk</title>
    <!--
      Stripe redirect target — public-facing.
      No auth guard: customers returning from Stripe Checkout (incl. enquiry-form
      flow) may have no vp_token. Staff returning from Stripe also land here.
      Venue display name is read from ?venue= query param so the page works for
      both authenticated and anonymous arrivals.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark:   #0f172a;
            --bg-card:   rgba(30,41,59,0.9);
            --border:    rgba(148,163,184,0.1);
            --primary:   #6366f1;
            --success:   #10b981;
            --text-main: #f8fafc;
            --text-muted:#94a3b8;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                              radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .receipt-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .check-circle {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--success), #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.75rem;
            box-shadow: 0 14px 40px rgba(16,185,129,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
            animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
        }
        @keyframes pop {
            0%   { transform: scale(0); }
            70%  { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .check-circle i {
            font-size: 3rem;
            color: white;
            animation: checkIn 0.3s ease 0.4s both;
        }
        @keyframes checkIn {
            from { opacity: 0; transform: scale(0.5); }
            to   { opacity: 1; transform: scale(1); }
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        .lead {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 2rem;
        }
        .lead .venue {
            color: var(--text-main);
            font-weight: 700;
        }
        .meta-strip {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 1rem 1.25rem;
            background: rgba(15,23,42,0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: left;
        }
        .meta-strip.hidden { display: none; }
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .meta-label { color: var(--text-muted); }
        .meta-value { color: var(--text-main); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.92; }
        .btn-primary   { background: var(--primary); color: white; }
        .btn-secondary { background: rgba(148,163,184,0.1); color: var(--text-muted); border: 1px solid var(--border); }
        .footer-note {
            margin-top: 1.75rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="receipt-card">
        <div class="check-circle"><i class="fa-solid fa-check"></i></div>
        <h1>Payment Received</h1>
        <p class="lead">
            Thank you for your booking at <span class="venue" id="venue-name">our venue</span>.
            A confirmation email is on its way.
        </p>

        <div class="meta-strip hidden" id="meta-strip">
            <div class="meta-row">
                <span class="meta-label">Booking ID</span>
                <span class="meta-value" id="meta-booking-id">—</span>
            </div>
        </div>

        <div class="actions">
            <a href="index.html" class="btn btn-primary" id="btn-dashboard" style="display:none;">
                <i class="fa-solid fa-chart-pie"></i> Back to Dashboard
            </a>
            <a href="https://andyjay72.github.io/VenueDesk/enquiry-form.html" class="btn btn-secondary" id="btn-public">
                <i class="fa-solid fa-house"></i> Close Window
            </a>
        </div>

        <div class="footer-note">
            Powered by <strong style="color:var(--text-main)">VenueDesk</strong>
        </div>
    </div>

    <script>
        // ── API base URLs — declared FIRST (Rule F1) ──────────────────────────
        // checkout.html doesn't currently make API calls (it's a static landing
        // page), but the constant is declared first to keep the convention if
        // future enhancements (e.g. fetching booking details) are added.
        const DASH_DB_API = 'https://api.venuedesk.co.uk';

        // ── Populate venue name + booking ref from URL query params ──────────
        // Pattern: success_url=https://.../checkout.html?venue=Demo+Hall&booking=<uuid>
        // - venue : populated by createStripeSession() from sessionStorage.vp_venue_name
        //           (staff path) or from the public enquiry form (which knows the tenant).
        // - booking : surfaces the booking_id for the customer to quote in support.
        (function() {
            const params = new URLSearchParams(window.location.search);
            const venue   = params.get('venue');
            const booking = params.get('booking');
            if (venue) {
                document.getElementById('venue-name').textContent = decodeURIComponent(venue);
            }
            if (booking) {
                document.getElementById('meta-booking-id').textContent = booking;
                document.getElementById('meta-strip').classList.remove('hidden');
            }

            // If the visitor has a staff session, show the Back to Dashboard CTA.
            // Public customers (no vp_token) see only the Close Window option.
            const hasSession = !!sessionStorage.getItem('vp_token');
            if (hasSession) {
                document.getElementById('btn-dashboard').style.display = 'inline-flex';
                document.getElementById('btn-public').style.display    = 'none';
            }
        })();
    </script>
</body>
</html>
