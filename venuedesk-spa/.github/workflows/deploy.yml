# ─────────────────────────────────────────────────────────────────────────────
# VenueDesk SPA — GitHub Pages Deploy
#
# Triggers on push to main (venuedesk-spa/** changes only).
# Builds with Vite and pushes the dist/ output to the CommunityHub repo,
# which is the GitHub Pages source for andyjay72.github.io/VenueDesk.
#
# Required GitHub secret: COMMUNITYHUB_DEPLOY_KEY
#   An SSH deploy key with write access to AndyJay72/CommunityHub.
#   Generate with: ssh-keygen -t ed25519 -C "venuedesk-spa-deploy"
#   Add public key to CommunityHub repo → Settings → Deploy keys (allow write)
#   Add private key to VenueDesk repo → Settings → Secrets → COMMUNITYHUB_DEPLOY_KEY
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'venuedesk-spa/**'
      - '.github/workflows/deploy.yml'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: venuedesk-spa

    steps:
      - name: Checkout VenueDesk repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: venuedesk-spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy dist/ to CommunityHub repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use a deploy key for the CommunityHub repo
          deploy_key: ${{ secrets.COMMUNITYHUB_DEPLOY_KEY }}
          external_repository: AndyJay72/CommunityHub
          publish_branch: main
          publish_dir: venuedesk-spa/dist
          # Preserve existing files not in dist/ (old HTML pages during transition)
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: deploy SPA build ${{ github.sha }}'
